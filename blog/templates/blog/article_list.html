{% extends "blog/base.html" %}

{% block title %}
    文章列表 - Django 大冒險
{% endblock title %}

{% block blog_content %}
    <h2>
        文章列表
    </h2>
    <div class="article-grid">
        {% for article in articles %}
            {% include "blog/components/article_card.html" %}
        {% empty %}
            <p>
                目前沒有文章
            </p>
        {% endfor %}
    </div>
{% endblock blog_content %}
