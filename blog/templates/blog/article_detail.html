{% extends "base.html" %}

{% block title %}
    {{ article.title }} - {{ block.super }}
{% endblock title %}

{% block content %}
    <article>
        <h2>
            {{ article.title }}
        </h2>
        <p>
            作者：{{ article.author.name }}
        </p>
        <p>
            發布時間：{{ article.created_at }}
        </p>
        <div>
            {{ article.content }}
        </div>
    </article>
{% endblock content %}
